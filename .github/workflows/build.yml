name: Build Xbox UWP
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Download Godot 4.2.2
        run: |
          Invoke-WebRequest -Uri "https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_win64.exe.zip" -OutFile godot.zip
          Expand-Archive godot.zip -DestinationPath .
          Invoke-WebRequest -Uri "https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_export_templates.tpz" -OutFile templates.tpz
          Expand-Archive templates.tpz -DestinationPath templates
          New-Item -ItemType Directory -Force -Path "$env:APPDATA\Godot\export_templates\4.2.2.stable"
          Copy-Item "templates/templates/*" -Destination "$env:APPDATA\Godot\export_templates\4.2.2.stable" -Recurse

      - name: Export UWP for Xbox One X
        run: |
          mkdir build
          .\Godot_v4.2.2-stable_win64.exe --headless --export-release "Windows UWP" build/XboxOneX.appx

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: XboxOneX-1787-Build
          path: build/XboxOneX.appx
