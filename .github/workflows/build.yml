name: Build Hunters Wild
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  export-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Godot 4
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
      - name: Export
        run: |
          mkdir -p build/windows
          godot --headless --export-release "Windows Desktop" build/windows/HuntersWild.exe
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: HuntersWild-Windows
          path: build/windows/
